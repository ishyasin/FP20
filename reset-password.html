<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set your passcode — FP10 Manager 2</title>
<link rel="stylesheet" href="shared/app.css"/>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <div class="brand">
      <div class="brand-bar"></div>
      <div class="brand-text">
        <span class="brand-eyebrow">by ED&amp;G™</span>
        <span class="brand-name">FP10 Manager <span class="accent">2</span></span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="signOut()">Sign out</button>
    </div>
  </div>
</nav>

<main class="wrap" style="max-width:480px;">
  <div class="card">
    <div class="section-heading">
      <div class="eyebrow">First sign-in</div>
      <h1>Set your <span class="accent">passcode</span></h1>
      <div class="heading-rule"></div>
    </div>
    <p class="subtitle">Your administrator gave you a temporary passcode. Choose your own before continuing. It must be at least 8 characters.</p>
    <div id="alert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label for="pc1">New passcode</label>
        <input type="password" id="pc1" autocomplete="new-password" minlength="8" maxlength="72" required />
      </div>
      <div class="form-group">
        <label for="pc2">Confirm new passcode</label>
        <input type="password" id="pc2" autocomplete="new-password" minlength="8" maxlength="72" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Save and continue</button>
    </form>
  </div>
</main>

<footer class="app-footer" data-app-footer></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/fp10-api.js"></script>
<script>
  let ME = null;
  getMe().then((me) => {
    if (!me || !me.isActive) { window.location.replace('login.html'); return; }
    if (!me.must_reset_password) { window.location.replace(me.isAdmin ? 'admin.html' : 'index.html'); return; }
    ME = me;
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('alert');
    const pc1 = document.getElementById('pc1').value;
    const pc2 = document.getElementById('pc2').value;
    alertEl.innerHTML = '';
    if (pc1.length < 8) { alertEl.innerHTML = '<div class="alert alert-error">Passcode must be at least 8 characters.</div>'; return; }
    if (pc1 !== pc2) { alertEl.innerHTML = '<div class="alert alert-error">The two passcodes don\'t match.</div>'; return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await setMyPasscode(pc1);
      window.location.replace(ME && ME.isAdmin ? 'admin.html' : 'index.html');
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Save and continue';
    }
  });
</script>
</body>
</html>
